services:
  node4:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: lan-node-4
    hostname: node4
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      simulated_lan:
        ipv4_address: 10.5.0.13
        mac_address: 02:42:0a:05:00:0d
    environment:
      - ROLE=node
      - NODE_NAME=node4
      - PEER_ENDPOINT=host.docker.internal:9051
      - GATEWAY_PEER=peer0.org2.example.com
      - MSP_ID=Org2MSP
      - CHANNEL_NAME=mychannel
      - CHAINCODE_NAME=arptracker
      - DISABLE_BACKGROUND_TRAFFIC=${DISABLE_BACKGROUND_TRAFFIC:-false}
    volumes:
      - ../fabric-samples/test-network/organizations:/fabric-config/organizations:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

